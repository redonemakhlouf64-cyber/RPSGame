name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv
      - name: Prepare CI spec
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('buildozer.spec')
          skip = ('android.sdk_path', 'android.ndk_path', 'android.skip_update')
          lines = [l for l in p.read_text().splitlines() if not l.startswith(skip)]
          p.write_text('\n'.join(lines) + '\n')
          PY
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.cache/pip
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-
      - name: Build APK
        run: yes | buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: RPSGame-apk
          path: bin/*.apk
          if-no-files-found: error
